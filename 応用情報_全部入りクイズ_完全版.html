<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT基礎力クイズ</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>
    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        "Hiragino Kaku Gothic ProN",
        Meiryo,
        sans-serif;
    }

    .choice-btn {
      transition: all 0.2s ease;
    }

    .choice-btn:not(.disabled):hover {
      transform: translateY(-2px);
    }

    .choice-btn.correct {
      background-color: #dcfce7 !important;
      border-color: #22c55e !important;
      color: #166534 !important;
    }

    .choice-btn.incorrect {
      background-color: #fee2e2 !important;
      border-color: #ef4444 !important;
      color: #991b1b !important;
    }

    .choice-btn.disabled {
      cursor: default;
    }

    .fade-in {
      animation: fadeIn 0.35s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .progress-fill {
      transition: width 0.35s ease;
    }

    .feature-card {
      background: #fff;
      border-radius: 1.25rem;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
      border: 1px solid #e2e8f0;
    }
    .history-item {
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .history-item:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.08);
    }
  </style>
</head>

<body class="min-h-screen bg-slate-100 text-slate-800">

  <!-- =========================
       スタート画面
  ========================== -->

      <div class="bg-white rounded-3xl shadow-xl overflow-hidden">

            <button

            <button

            <button

            <div class="feature-card p-4">

                <i class="fa-solid fa-user text-indigo-600 mr-2"></i>ランキング名

              <input id="player-name" maxlength="20" placeholder="例：AP挑戦者"

          <p class="text-center text-xs text-slate-400 mt-3">
            ※80問を選ぶと本番を意識した長めの演習ができます。出題数はいつでも変更できます。
          </p>

          <!-- スタート -->
          <button
            id="start-btn"

            <i class="fa-solid fa-play mr-2"></i>
            クイズを開始する

          <p class="text-center text-sm text-slate-400 mt-4">
            出題数とカテゴリを自由に変更できます。問題と選択肢は毎回ランダムです
          </p>

          <!-- 最近の学習 -->

            <div class="feature-card p-5">
              <div class="flex items-center justify-between mb-4">
                <h3 class="font-bold text-lg">

                <span id="recent-count" class="text-xs text-slate-400">0件</span>

              <div id="recent-list" class="space-y-3">

            <div class="feature-card p-5">
              <div class="flex items-center justify-between mb-4">
                <h3 class="font-bold text-lg">
                  <i class="fa-solid fa-book-open text-red-500 mr-2"></i>間違えた問題・復習
                </h3>
                <span id="wrong-count" class="text-xs text-slate-400">0問</span>
              </div>
              <div id="wrong-list" class="space-y-3">
                <p class="text-sm text-slate-400">間違えた問題はありません。</p>
              </div>
              <button id="review-wrong-btn"
                class="hidden w-full mt-4 bg-red-500 hover:bg-red-600 text-white font-bold py-3 rounded-xl transition">
                <i class="fa-solid fa-rotate-right mr-2"></i>間違えた問題をまとめて復習

          </div>

          <!-- ランキング -->

            <div class="flex items-center justify-between mb-4">
              <h3 class="font-bold text-lg">
                <i class="fa-solid fa-ranking-star text-yellow-500 mr-2"></i>ランキング
              </h3>
              <span id="ranking-status" class="text-xs text-slate-400">準備中</span>
            </div>
            <div id="ranking-list" class="space-y-2">
              <p class="text-sm text-slate-400">ランキングを読み込んでいます。</p>
            </div>
          </div>

        </div>
      </div>

    </div>
  </section>


  <!-- =========================
       クイズ画面
  ========================== -->
  <section id="quiz-screen" class="hidden min-h-screen p-4 sm:p-6">

    <div class="max-w-3xl mx-auto">

      <!-- 上部 -->
      <div class="flex items-center justify-between mb-4">

        <div
          id="quiz-progress-badge"
          class="hidden bg-white rounded-full px-4 py-2 shadow-sm text-sm font-semibold"
        >
          <i class="fa-solid fa-list-check text-indigo-600 mr-2"></i>
          <span id="current-num">1</span>
          /
          <span id="total-num">10</span>
        </div>

        <div class="bg-white rounded-full px-4 py-2 shadow-sm text-sm font-bold">
          SCORE:
          <span id="live-score" class="text-indigo-600">0</span>

      </div>

      <!-- プログレスバー -->
      <div class="h-2 bg-slate-200 rounded-full overflow-hidden mb-6">
        <div
          id="progress-bar"
          class="progress-fill h-full bg-gradient-to-r from-indigo-500 to-violet-500"
          style="width: 0%"
        ></div>
      </div>


      <!-- 問題カード -->
      <div class="bg-white rounded-3xl shadow-xl overflow-hidden fade-in">

        <div class="p-6 sm:p-8">

          <!-- カテゴリ -->
          <div class="flex items-center justify-between mb-5">

            <span
              id="question-category"
              class="inline-flex items-center px-3 py-1 rounded-full bg-indigo-50 text-indigo-700 text-sm font-semibold"
            >
              カテゴリ
            </span>

            <span
              id="question-id-tag"
              class="text-sm text-slate-400"
            >
              Q1
            </span>

          </div>

          <!-- 問題 -->
          <h2
            id="question-text"
            class="text-xl sm:text-2xl font-bold leading-relaxed mb-7"

            問題文
          </h2>

          <!-- 選択肢 -->
          <div id="choices-container" class="space-y-3">
          </div>

          <!-- 解説 -->
          <div
            id="explanation-box"
            class="hidden mt-6 rounded-2xl overflow-hidden"
          >

            <div
              id="explanation-result-title"
              class="px-5 py-3 font-bold"
            >
            </div>

            <div
              id="explanation-text"
              class="bg-slate-50 border border-slate-200 border-t-0 rounded-b-2xl p-5 text-sm sm:text-base leading-7 whitespace-pre-line"
            >
            </div>

          </div>

          <!-- 次へ -->
          <button
            id="next-btn"
            class="hidden w-full mt-6 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl transition"

  <!-- =========================
       結果画面

          class="w-24 h-24 mx-auto rounded-full flex items-center justify-center mb-6 bg-indigo-50 text-indigo-600"

        </div>

        <p class="text-slate-500 font-semibold mb-2">

        </p>

        <h1 class="text-3xl sm:text-4xl font-bold mb-8">
          クイズ終了！
        </h1>

        <div class="grid grid-cols-2 gap-4 mb-7">

          <div class="bg-slate-50 rounded-2xl p-5">
            <p class="text-sm text-slate-500 mb-1">
              正解数
            </p>
            <p class="text-3xl font-bold text-indigo-600">

                <span id="score-total">0</span>

            <p class="text-sm text-slate-500 mb-1">
              正解率
            </p>
            <p class="text-3xl font-bold text-violet-600">
              <span id="score-percentage">0</span>%
            </p>
          </div>

        </div>

        <div
          id="feedback-message"
          class="bg-indigo-50 text-indigo-800 rounded-2xl p-5 mb-7 font-semibold"
        >
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <button
            id="retry-btn"
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl transition"

            もう一度挑戦する
          </button>

          <button id="home-btn"
            class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-4 rounded-xl transition">
            <i class="fa-solid fa-house mr-2"></i>ホームへ戻る
          </button>
        </div>

        <button id="result-review-wrong-btn"
          class="hidden w-full mt-3 bg-red-50 hover:bg-red-100 text-red-700 font-bold py-3 rounded-xl transition">
          <i class="fa-solid fa-book-open mr-2"></i>今回の間違いを復習する
        </button>

      </div>

    </div>
  </section>


<script>
/* =========================================================
   問題データ
========================================================= */

const questionsDatabase = [

  {
    category: "基礎理論・数値計算",
    question: "値がほぼ等しい2つの浮動小数点数の差を計算したとき、有効桁数が極端に減少する現象はどれか。",
    choices: [
      { text: "桁落ち", isCorrect: true },
      { text: "情報落ち", isCorrect: false },
      { text: "丸め誤差", isCorrect: false },
      { text: "アンダーフロー", isCorrect: false }
    ],
    explanation:
`【正解：桁落ち】

値がほぼ等しい2つの浮動小数点数の差を計算した際、有効桁数が極端に減少する現象を「桁落ち」と呼びます。

例えば、
1.23456 - 1.23412 = 0.00044

となり、差を取る前と比べて有効桁数が大きく減少します。

・情報落ち：絶対値の大きな数と小さな数を加減算した際、小さな数が結果に反映されなくなる現象。
・丸め誤差：有限の桁数に収めるため、四捨五入や切り捨てなどを行うことで生じる誤差。`
  },

  {
    category: "基礎理論・数値計算",
    question: "2進数「10110」を5ビットの2の補数表現として表された負の数であるとしたとき、これを10進数で表現した値はどれか。",
    choices: [
      { text: "-10", isCorrect: true },
      { text: "-6", isCorrect: false },
      { text: "-11", isCorrect: false },
      { text: "-22", isCorrect: false }
    ],
    explanation:
`【正解：-10】

10110 は5ビットの2の補数表現で、最上位ビットが1なので負数です。

元の絶対値を求めるには、ビットを反転して1を加えます。

1) 10110 → 01001（ビット反転）
2) 01001 + 1 → 01010
3) 01010 は10進数で10

したがって、
10110 = -10

となります。`
  },

  {
    category: "AI・アルゴリズム",
    question: "機械学習のアルゴリズムにおいて、あらかじめ正解（ラベル）が与えられたデータをもとに学習を行い、新しいデータの予測や分類を行う手法はどれか。",
    choices: [
      { text: "教師あり学習", isCorrect: true },
      { text: "教師なし学習", isCorrect: false },
      { text: "強化学習", isCorrect: false },
      { text: "アンサンブル学習", isCorrect: false }
    ],
    explanation:
`【正解：教師あり学習】

入力データと、それに対応する正解ラベルのペアを学習データとして用いる手法です。

代表例として、
・回帰
・分類
・サポートベクターマシン（SVM）
などがあります。

・教師なし学習：正解ラベルのないデータから構造やパターンを見つけます。
・強化学習：行動によって得られる報酬を最大化するように学習します。`
  },

  {
    category: "AI・アルゴリズム",
    question: "データを一列に並べた構造で、新しく追加する要素を常に末尾に入れ、取り出すときは常に先頭から行う「先入れ先出し（FIFO）」の特徴を持つデータ構造はどれか。",
    choices: [
      { text: "キュー（Queue）", isCorrect: true },
      { text: "スタック（Stack）", isCorrect: false },
      { text: "ツリー（Tree）", isCorrect: false },
      { text: "ヒープ（Heap）", isCorrect: false }
    ],
    explanation:
`【正解：キュー（Queue）】

先に入れたデータから順番に取り出す「先入れ先出し（FIFO）」のデータ構造をキューと呼びます。

データを追加する操作を「エンキュー」、
データを取り出す操作を「デキュー」といいます。

・スタック：後入れ先出し（LIFO）
・ツリー：階層的な木構造
・ヒープ：優先度などを効率的に扱うための木構造`
  },

  {
    category: "コンピュータシステム",
    question: "CPUと主記憶装置（メインメモリ）の間に配置され、速度差を吸収することで処理を高速化するために用いられる高速な記憶装置はどれか。",
    choices: [
      { text: "キャッシュメモリ", isCorrect: true },
      { text: "フラッシュメモリ", isCorrect: false },
      { text: "仮想メモリ", isCorrect: false },
      { text: "レジスタ", isCorrect: false }
    ],
    explanation:
`【正解：キャッシュメモリ】

高速なCPUと、CPUよりアクセス速度が遅い主記憶の間に高速なキャッシュメモリを置くことで、データアクセスの待ち時間を減らします。

キャッシュには一般に高速なSRAMが使われます。

・レジスタ：CPU内部にある非常に高速な記憶領域。
・仮想メモリ：補助記憶装置の領域を主記憶のように利用する仕組み。`
  },

  {
    category: "コンピュータシステム",
    question: "1つのシステムを稼働させつつ、もう1つのシステムを待機（バックアップ）状態にしておき、本番系が故障した際に待機系へ切り替える運用形態はどれか。",
    choices: [
      { text: "デュプレックスシステム", isCorrect: true },
      { text: "デュアルシステム", isCorrect: false },
      { text: "マルチプロセッシングシステム", isCorrect: false },
      { text: "クラスタリングシステム", isCorrect: false }
    ],
    explanation:
`【正解：デュプレックスシステム】

主系と待機系の2系統を用意し、主系に障害が発生した場合に待機系へ処理を引き継ぐ構成です。

・デュアルシステム：2つの系統が同時に同じ処理を行い、結果を比較する方式。
・クラスタリング：複数のコンピュータを連携させてシステムを構成する方式。`
  },

  {
    category: "データベース・NW・セキュリティ",
    question: "リレーショナルデータベースにおいて、データの追加・更新・削除などの一連の処理が「完全に成功するか、全く行われなかったか」のいずれかであることを保証するトランザクションの性質はどれか。",
    choices: [
      { text: "原子性（Atomicity）", isCorrect: true },
      { text: "一貫性（Consistency）", isCorrect: false },
      { text: "独立性（Isolation）", isCorrect: false },
      { text: "永続性（Durability）", isCorrect: false }
    ],
    explanation:
`【正解：原子性（Atomicity）】

ACID特性の「A」にあたる性質です。

トランザクションが途中で失敗した場合には、ロールバックによって処理開始前の状態に戻すことができます。

・一貫性：データベースの制約や規則を満たす状態を維持する。
・独立性：同時実行されるトランザクションの影響を適切に分離する。
・永続性：コミットされた結果が障害後も失われない。`
  },

========================================================= */

function questionKey(q) {
  const text = `${q.category}|${q.question}`;
  let hash = 0;
  for (let i = 0; i < text.length; i++) {
    hash = ((hash << 5) - hash) + text.charCodeAt(i);
    hash |= 0;
  }
  return `q_${Math.abs(hash)}`;
}

function getQuestionByKey(key) {
  return questionsDatabase.find(q => questionKey(q) === key);
}

function readStorage(key, fallback) {
  try {
    return JSON.parse(localStorage.getItem(key)) ?? fallback;
  } catch {
    return fallback;
  }
}

function writeStorage(key, value) {
  localStorage.setItem(key, JSON.stringify(value));
}

function saveRecentQuestion(q, isCorrect) {
  const recent = readStorage(STORAGE_KEYS.recent, []);
  const item = {
    key: questionKey(q),
    category: q.category,
    question: q.question,
    isCorrect,
    playedAt: new Date().toISOString()
  };
  const next = [item, ...recent.filter(x => x.key !== item.key)].slice(0, 12);
  writeStorage(STORAGE_KEYS.recent, next);
}

function saveWrongQuestion(q) {
  const wrong = readStorage(STORAGE_KEYS.wrong, []);
  const item = {
    key: questionKey(q),
    category: q.category,
    question: q.question,
    addedAt: new Date().toISOString()
  };
  const next = [item, ...wrong.filter(x => x.key !== item.key)].slice(0, 100);
  writeStorage(STORAGE_KEYS.wrong, next);
}

function removeWrongQuestion(q) {
  const wrong = readStorage(STORAGE_KEYS.wrong, []);
  writeStorage(
    STORAGE_KEYS.wrong,
    wrong.filter(x => x.key !== questionKey(q))
  );
}

function getWrongQuestions() {
  return readStorage(STORAGE_KEYS.wrong, [])
    .map(x => getQuestionByKey(x.key))
    .filter(Boolean);
}

function loadPlayerName() {
  const name = localStorage.getItem(STORAGE_KEYS.name) || "";
  playerNameInput.value = name;
}

function savePlayerName() {
  let name = playerNameInput.value.trim().slice(0, 20);
  if (!name) name = `AP挑戦者${Math.floor(1000 + Math.random() * 9000)}`;
  playerNameInput.value = name;
  localStorage.setItem(STORAGE_KEYS.name, name);
  return name;
}

function startReviewWrong() {
  const wrong = getWrongQuestions();
  if (!wrong.length) {
    alert("現在、間違えた問題はありません。");
    return;
  }

  currentQuestions = wrong.map(q => ({
    ...q,
    choices: [...q.choices]
  }));

  shuffleArray(currentQuestions);
  currentQuestions.forEach(q => shuffleArray(q.choices));

  const requestedCount = questionCountSelect.value === "all"
    ? currentQuestions.length
    : Number(questionCountSelect.value);

  currentQuestions = currentQuestions.slice(0, Math.min(requestedCount, currentQuestions.length));

  currentQuestionIndex = 0;
  score = 0;
  liveScore.textContent = score;
  startScreen.classList.add("hidden");
  resultScreen.classList.add("hidden");
  quizScreen.classList.remove("hidden");
  quizProgressBadge.classList.remove("hidden");
  totalNum.textContent = currentQuestions.length;
  showQuestion();
}

  rankingList.innerHTML = sorted.map((r, i) => `

    </div>
  `).join("");

async function initFirebase() {
  const enabled = FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId && FIREBASE_CONFIG.appId;
  if (!enabled) {
    renderLocalRanking();
    rankingStatus.textContent = "Firebase未設定";
    return;
  }

  try {
    const appMod = await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js");
    const authMod = await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js");
    const fsMod = await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js");

    const app = appMod.initializeApp(FIREBASE_CONFIG);
    firebaseAuth = authMod.getAuth(app);
    firebaseDb = fsMod.getFirestore(app);
    firebaseFns = fsMod;

    await authMod.signInAnonymously(firebaseAuth);
    firebaseReady = true;
    await loadGlobalRanking();
  } catch (e) {
    console.error(e);
    rankingStatus.textContent = "公開ランキング接続エラー";
    renderLocalRanking();
  }
}

async function submitGlobalScore(attempt) {
  const local = readStorage("ap_quiz_local_scores_v2", []);
  writeStorage("ap_quiz_local_scores_v2", [attempt, ...local].slice(0, 30));
  renderLocalRanking();

  if (!firebaseReady || !firebaseDb || !firebaseFns) return;

  try {
    const { collection, addDoc, serverTimestamp } = firebaseFns;
    await addDoc(collection(firebaseDb, "scores"), {
      name: attempt.name,
      score: attempt.score,
      total: attempt.total,
      percentage: attempt.percentage,
      mode: attempt.mode,
      category: attempt.category,
      createdAt: serverTimestamp()
    });
    await loadGlobalRanking();
  } catch (e) {
    console.error("ランキング送信失敗", e);
  }
}

async function loadGlobalRanking() {
  if (!firebaseReady) return;

  try {
    const { collection, getDocs, query, orderBy, limit } = firebaseFns;
    const q = query(
      collection(firebaseDb, "scores"),
      orderBy("percentage", "desc"),
      limit(50)
    );
    const snap = await getDocs(q);
    const rows = snap.docs.map(d => d.data());

    rows.sort((a,b) =>
      (b.percentage || 0) - (a.percentage || 0) ||
      (b.score || 0) - (a.score || 0)
    );

    rankingList.innerHTML = rows.slice(0, 20).map((r, i) => `
      <div class="flex items-center gap-3 border-b border-slate-100 last:border-0 py-2">
        <span class="w-7 text-center font-black ${i === 0 ? "text-yellow-500" : "text-slate-500"}">${i+1}</span>
        <div class="flex-1 min-w-0">
          <div class="font-bold truncate">${escapeHtml(r.name || "AP挑戦者")}</div>
          <div class="text-xs text-slate-400">${escapeHtml(r.mode || "")}・${escapeHtml(r.category || "すべて")}</div>
        </div>
        <div class="font-black text-indigo-600">${Number(r.percentage || 0)}%</div>
      </div>
    `).join("") || `<p class="text-sm text-slate-400">まだランキングデータがありません。</p>`;

    rankingStatus.textContent = "みんなのランキング";
  } catch (e) {
    console.error("ランキング取得失敗", e);
    rankingStatus.textContent = "ランキング取得失敗";
  }
}

  const currentIcon = btn.querySelector("i");

  if (currentIcon) {
    currentIcon.className = "fa-solid fa-check";
  }


  selectedCategory = btn.getAttribute("data-cat");

});


/* =========================================================
   シャッフル
========================================================= */

function shuffleArray(array) {

  for (let i = array.length - 1; i > 0; i--) {

    const j = Math.floor(Math.random() * (i + 1));

    [array[i], array[j]] = [array[j], array[i]];

  }

  return array;

}


/* =========================================================
   クイズ開始
========================================================= */

startBtn.addEventListener("click", startQuiz);


function startQuiz() {

  if (selectedCategory === "all") {

    currentQuestions = questionsDatabase.map(q => ({
      ...q,
      choices: [...q.choices]
    }));

  } else {

    currentQuestions = questionsDatabase
      .filter(q => q.category === selectedCategory)
      .map(q => ({
        ...q,
        choices: [...q.choices]
      }));

  }


  shuffleArray(currentQuestions);


  currentQuestions.forEach(q => {
    shuffleArray(q.choices);
  });


  const requestedCount = questionCountSelect.value === "all"
    ? currentQuestions.length
    : Number(questionCountSelect.value);

  const maxQuestions = Math.min(requestedCount, currentQuestions.length);

  currentQuestions = currentQuestions.slice(0, maxQuestions);


  if (currentQuestions.length === 0) {

    alert("選択されたカテゴリに問題がありません。");

    return;

  }


  currentQuestionIndex = 0;
  score = 0;

  liveScore.textContent = score;

  startScreen.classList.add("hidden");
  resultScreen.classList.add("hidden");

  quizScreen.classList.remove("hidden");
  quizProgressBadge.classList.remove("hidden");

  totalNum.textContent = currentQuestions.length;

  showQuestion();

}


/* =========================================================
   問題表示
========================================================= */

function showQuestion() {

  hasAnswered = false;

  explanationBox.classList.add("hidden");
  nextBtn.classList.add("hidden");

  const currentQuestion =
    currentQuestions[currentQuestionIndex];


  currentNum.textContent =
    currentQuestionIndex + 1;

  questionIdTag.textContent =
    `Q${currentQuestionIndex + 1}`;


  questionCategory.textContent =
    currentQuestion.category;


  questionText.textContent =
    currentQuestion.question;


  const progress =
    ((currentQuestionIndex) / currentQuestions.length) * 100;

  progressBar.style.width = `${progress}%`;


  choicesContainer.innerHTML = "";


  currentQuestion.choices.forEach((choice, index) => {

    const button = document.createElement("button");

    button.className =
      "choice-btn w-full text-left bg-white border-2 border-slate-200 rounded-xl p-4 sm:p-5 font-semibold text-slate-700 hover:border-indigo-400 hover:bg-indigo-50";

    button.innerHTML = `
      <div class="flex items-center gap-4">
        <span class="flex-shrink-0 w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center text-sm font-bold">
          ${String.fromCharCode(65 + index)}
        </span>

        <span>${escapeHtml(choice.text)}</span>
      </div>
    `;


    button.addEventListener("click", () => {

      answerQuestion(button, choice);

    });


    choicesContainer.appendChild(button);

  });

}


/* =========================================================
   回答
========================================================= */

function answerQuestion(selectedButton, selectedChoice) {

  if (hasAnswered) return;

  hasAnswered = true;


  const currentQuestion =
    currentQuestions[currentQuestionIndex];


  const buttons =
    [...choicesContainer.querySelectorAll(".choice-btn")];


  buttons.forEach(button => {
    button.classList.add("disabled");
  });


  if (selectedChoice.isCorrect) {

    score++;

    liveScore.textContent = score;

    selectedButton.classList.add("correct");

    explanationResultTitle.className =
      "px-5 py-3 font-bold bg-green-100 text-green-800 rounded-t-2xl";

    explanationResultTitle.innerHTML =
      `<i class="fa-solid fa-circle-check mr-2"></i>正解！`;

  }

  else {

    selectedButton.classList.add("incorrect");

    explanationResultTitle.className =
      "px-5 py-3 font-bold bg-red-100 text-red-800 rounded-t-2xl";

    explanationResultTitle.innerHTML =
      `<i class="fa-solid fa-circle-xmark mr-2"></i>不正解`;

  }


  /* 正解の選択肢を緑にする */

  buttons.forEach((button, index) => {

    const choice =
      currentQuestion.choices[index];

    if (choice.isCorrect) {
      button.classList.add("correct");
    }

  });


  lastAnswerWasCorrect = !!selectedChoice.isCorrect;
  saveRecentQuestion(currentQuestion, lastAnswerWasCorrect);

  if (lastAnswerWasCorrect) {
    removeWrongQuestion(currentQuestion);
  } else {
    saveWrongQuestion(currentQuestion);
  }

  explanationText.textContent =
    currentQuestion.explanation;


  explanationBox.classList.remove("hidden");


  if (currentQuestionIndex <
      currentQuestions.length - 1) {

    nextBtn.innerHTML =
      `次の問題へ <i class="fa-solid fa-arrow-right ml-2"></i>`;

  } else {

    nextBtn.innerHTML =
      `結果を見る <i class="fa-solid fa-trophy ml-2"></i>`;

  }


  nextBtn.classList.remove("hidden");

}


/* =========================================================
   次の問題
========================================================= */

nextBtn.addEventListener("click", () => {

  if (!hasAnswered) return;


  currentQuestionIndex++;


  if (currentQuestionIndex >= currentQuestions.length) {

    showResult();

  } else {

    showQuestion();

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }

});


/* =========================================================
   結果
========================================================= */

function showResult() {

  quizScreen.classList.add("hidden");

  resultScreen.classList.remove("hidden");


  const total =
    currentQuestions.length;


  const percentage =
    Math.round((score / total) * 100);


  scoreVal.textContent =
    score;

  scoreTotal.textContent =
    total;

  scorePercentage.textContent =
    percentage;


  let message = "";
  let color = "";


  if (percentage === 100) {

    message =
      "🎉 全問正解！完璧です！IT基礎知識がしっかり身についています。";

    color =
      "bg-green-50 text-green-800";

    resultIcon.className =
      "w-24 h-24 mx-auto rounded-full flex items-center justify-center mb-6 bg-green-100 text-green-600";

  }

  else if (percentage >= 80) {

    message =
      "👏 素晴らしい成績です！かなり理解できています。";

    color =
      "bg-indigo-50 text-indigo-800";

    resultIcon.className =
      "w-24 h-24 mx-auto rounded-full flex items-center justify-center mb-6 bg-indigo-100 text-indigo-600";

  }

  else if (percentage >= 60) {

    message =
      "👍 いい感じです！間違えた問題を復習するとさらに伸びます。";

    color =
      "bg-blue-50 text-blue-800";

    resultIcon.className =
      "w-24 h-24 mx-auto rounded-full flex items-center justify-center mb-6 bg-blue-100 text-blue-600";

  }

  else if (percentage >= 40) {

    message =
      "📚 もう一歩！解説を読みながらもう一度挑戦してみましょう。";

    color =
      "bg-yellow-50 text-yellow-800";

    resultIcon.className =
      "w-24 h-24 mx-auto rounded-full flex items-center justify-center mb-6 bg-yellow-100 text-yellow-600";

  }

  else {

    message =
      "💪 ここからです！何度か挑戦してIT基礎知識を身につけましょう。";

    color =
      "bg-red-50 text-red-800";

    resultIcon.className =
      "w-24 h-24 mx-auto rounded-full flex items-center justify-center mb-6 bg-red-100 text-red-600";

  }


  feedbackMessage.className =
    `${color} rounded-2xl p-5 mb-7 font-semibold`;

  feedbackMessage.textContent =
    message;

  saveAttemptResult();

  const wrongThisRound = currentQuestions.filter(q => {
    const recent = readStorage(STORAGE_KEYS.recent, []);
    const item = recent.find(x => x.key === questionKey(q));
    return item && item.isCorrect === false;
  });

  if (wrongThisRound.length) {
    resultReviewWrongBtn.classList.remove("hidden");
  } else {
    resultReviewWrongBtn.classList.add("hidden");
  }

  renderStudyPanels();

  progressBar.style.width = "100%";

}


reviewWrongBtn.addEventListener("click", startReviewWrong);

resultReviewWrongBtn.addEventListener("click", () => {
  resultScreen.classList.add("hidden");
  startReviewWrong();
});

homeBtn.addEventListener("click", goHome);

playerNameInput.addEventListener("change", savePlayerName);

loadPlayerName();
renderStudyPanels();
initFirebase();

/* =========================================================
   リトライ
========================================================= */

retryBtn.addEventListener("click", () => {

  resultScreen.classList.add("hidden");

  startScreen.classList.remove("hidden");

  progressBar.style.width = "0%";

  renderStudyPanels();

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

});


/* =========================================================
   HTMLエスケープ
========================================================= */

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text;

  return div.innerHTML;

}

</script>
